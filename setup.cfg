[metadata]
name = ls336-ioc
version = 0.1.0
description = EPICS IOC for Lakeshore 336 with Celsius support
author = Your Name

[options]
package_dir =
    = src
packages = find:
install_requires =
    caproto
    pyvisa
    emmi

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    ls336-ioc = ls336_ioc.application:main

